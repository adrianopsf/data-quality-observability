global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "airflow"
    static_configs:
      - targets: ["airflow-webserver:8080"]
    metrics_path: "/metrics"

  - job_name: "data_quality"
    static_configs:
      - targets: ["airflow-scheduler:8793"]
    metrics_path: "/metrics"

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
