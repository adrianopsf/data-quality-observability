name: mart_monthly_sales_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "%Y%m%d-%H%M%S-mart-monthly-sales"

validations:
  - batch_request:
      datasource_name: ecommerce_postgres
      data_connector_name: default_inferred_data_connector
      data_asset_name: mart.mart_monthly_sales
    expectation_suite_name: mart_monthly_sales_suite
    action_list:
      - name: store_validation_result
        action:
          class_name: StoreValidationResultAction
      - name: update_data_docs
        action:
          class_name: UpdateDataDocsAction
          site_names:
            - local_site

evaluation_parameters:
  current_month_minus_1: "$GE_CURRENT_MONTH_MINUS_1"

runtime_configuration:
  result_format:
    result_format: COMPLETE
    unexpected_index_column_names:
      - sale_month
